name: Testes Automatizados

on:
  push:
    branches: [ main, feat/testes-automatizados ]
  pull_request:
    branches: [ main ]

jobs:
  phpunit:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: epapirus_test
          MYSQL_USER: epapirus_test
          MYSQL_PASSWORD: epapirus_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, openssl
          coverage: none

      - name: Instalar dependências do Composer
        run: composer install --prefer-dist --no-progress --no-interaction
        working-directory: backend-php

      - name: Aguardar o MySQL ficar pronto
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u root -proot --silent; then
              echo "MySQL está pronto!"
              break
            fi
            echo "Aguardando MySQL..."
            sleep 2
          done

      - name: Criar banco de teste
        run: |
          mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE IF NOT EXISTS epapirus_test CHARACTER SET utf8mb4;"
          mysql -h 127.0.0.1 -u root -proot -e "GRANT ALL PRIVILEGES ON epapirus_test.* TO 'epapirus_test'@'%'; FLUSH PRIVILEGES;"
        working-directory: backend-php

      - name: Rodar os testes
        run: composer test
        working-directory: backend-php
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: epapirus_test
          DB_USER: epapirus_test
          DB_PASS: epapirus_test
          MAIL_HOST: 127.0.0.1
          MAIL_PORT: 1025
          MAIL_USER: teste@epapirus.local
          MAIL_PASS: teste
          JWT_SECRET: teste
          JWT_EXPIRATION: 86400
